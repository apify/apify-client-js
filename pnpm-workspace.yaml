packages:
  - website
  - scripts

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  # Renovate security update: axios@1.18.0
  - axios@1.18.0

allowBuilds:
  "@apify/ui-icons": false
  "@playwright/browser-chromium": true
  "@swc/core": true
  core-js: false
  esbuild: true
  puppeteer: true

overrides:
  markdown-it: ^15.0.0

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - "*"

patchedDependencies:
  '@signalwire/docusaurus-plugin-llms-txt@1.2.2': patches/@signalwire__docusaurus-plugin-llms-txt@1.2.2.patch
