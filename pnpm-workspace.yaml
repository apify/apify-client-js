packages:
  - website

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  # Renovate security update: axios@1.18.0
  - axios@1.18.0

onlyBuiltDependencies:
  - "@playwright/browser-chromium"
  - "@swc/core"
  - esbuild
  - puppeteer

overrides:
  js-yaml@4: ^5.0.0
  markdown-it: ^15.0.0

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
legacyPeerDeps: true
publicHoistPattern:
  - "*"
