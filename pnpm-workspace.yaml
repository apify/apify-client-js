packages:
  - website
  - scripts

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  # Renovate security update: axios@1.18.0
  - axios@1.18.0

allowBuilds:
  "@apify/ui-icons": false
  "@playwright/browser-chromium": true
  "@swc/core": true
  core-js: false
  esbuild: true
  puppeteer: true

overrides:
  js-yaml@4: ^5.0.0
  # Exempt @redocly/openapi-core (openapi-typescript's spec parser) from the
  # js-yaml v5 bump above. js-yaml 5 removed the `types` export, and redocly's
  # js-yaml wrapper reads `types.merge` at import time, so v5 makes it throw
  # `TypeError: Cannot read properties of undefined (reading 'merge')` before
  # it parses anything. 4.2.0 is still above the advisory floor the v4 line
  # override was originally added for.
  "@redocly/openapi-core>js-yaml": ^5.0.0
  markdown-it: ^15.0.0

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - "*"

patchedDependencies:
  '@signalwire/docusaurus-plugin-llms-txt@1.2.2': patches/@signalwire__docusaurus-plugin-llms-txt@1.2.2.patch
