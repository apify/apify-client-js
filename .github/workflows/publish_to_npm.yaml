name: Publish to NPM

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish (branch, tag, or commit SHA)
                required: true
                type: string
            tag:
                description: NPM dist-tag
                required: true
                type: choice
                default: latest
                options:
                    - latest
                    - beta

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish_to_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.4.0
            - name: Check version consistency and bump pre-release version (beta only)
              if: ${{ inputs.tag == 'beta' }}
              run: node ./.github/scripts/before-beta-release.js
            - name: Build module
              run: pnpm build
            - name: Publish to NPM
              run: pnpm publish --tag ${{ inputs.tag }} --no-git-checks
