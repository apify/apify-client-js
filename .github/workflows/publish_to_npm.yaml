name: Publish to NPM

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish (branch, tag, or commit SHA)
                required: true
                type: string
            tag:
                description: NPM dist-tag
                required: true
                type: choice
                default: latest
                options:
                    - latest
                    - next-v2

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish_to_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
            - name: Check that the ref is on a release branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  sha=$(git rev-parse HEAD)
                  branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | grep -E '^(master|[0-9]+\.x)$')
                  for branch in $branches; do
                      status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$sha" --jq .status || true)
                      if [[ "$status" == "identical" || "$status" == "behind" ]]; then exit 0; fi
                  done
                  echo "::error::$sha is not on a release branch"
                  exit 1
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.6.1
            - name: Check version consistency and bump pre-release version (pre-release tags only)
              if: ${{ inputs.tag != 'latest' }}
              run: node ./.github/scripts/before-beta-release.js
            - name: Build module
              run: pnpm build
            - name: Publish to NPM
              run: pnpm publish --tag ${{ inputs.tag }} --no-git-checks
